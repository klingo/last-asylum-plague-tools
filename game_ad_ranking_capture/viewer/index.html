<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Alliance Duel rankings</title>
<meta name="robots" content="noindex, nofollow">
<style>
body { font: 14px/1.4 system-ui, sans-serif; margin: 0; background: #1b1d22; color: #e6e6e6; }
header { position: sticky; top: 0; z-index: 2; background: #23262d; padding: 10px 14px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid #000; }
select { background: #14161a; color: inherit; border: 1px solid #444; border-radius: 4px; padding: 5px 8px; font: inherit; }
label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
#info { margin-left: auto; color: #9aa; }
#message { padding: 24px 14px; color: #c9a227; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 5px 10px; border-bottom: 1px solid #2c2f37; white-space: nowrap; }
th { position: sticky; top: var(--header-height, 49px); background: #23262d; text-align: right; cursor: pointer; user-select: none; z-index: 1; }
th.text, td.text { text-align: left; }
td.num { text-align: right; }
th small { display: block; font-weight: normal; color: #8a93a0; }
th.live small { color: #d9a441; }
th.sorted .label::after { content: " \25BC"; font-size: 10px; }   /* on the label, so it stays on the first line */
th.sorted.asc .label::after { content: " \25B2"; }
td.none { color: #555; }
img.status { float: left; height: 16px; margin-top: 2px; }   /* the icon of the own alliance's daily cells */
td.filled { font-style: italic; color: #b8b8b8; }
td.rank { color: #8a93a0; text-align: right; }
td.arank { color: #8a93a0; text-align: left; }
td.total { font-weight: 600; }
tr:hover td { background: #262a32; }
tr.mine td.name { color: #6cc070; }
.tag { color: #8a93a0; }
#legend { display: flex; gap: 12px; align-items: center; color: #9aa; font-size: 12px; }
#legend span { padding: 1px 8px; border-radius: 3px; color: #e6e6e6; }
#lang { font-size: 12px; padding: 3px 6px; }
#compare { display: flex; flex-wrap: wrap; gap: 10px 48px; padding: 8px 14px; font-variant-numeric: tabular-nums; }
#compare .stats { display: grid; grid-template-columns: max-content minmax(0, 1fr) minmax(0, 1fr); gap: 3px 24px; align-content: start; flex: 1 1 460px; max-width: 640px; }
#compare .days { display: grid; grid-template-columns: max-content 52px minmax(120px, 1fr) 52px; gap: 3px 6px; align-content: start; flex: 0 1 420px; }
#compare .stats > div { text-align: right; white-space: nowrap; }
#compare .label { text-align: left; color: #9aa; }
#compare .head { font-weight: 600; }
#compare .head small { display: block; font-weight: normal; color: #8a93a0; }
#compare .s0.head { color: #6aa0d8; }
#compare .s1.head { color: #e0685f; }
#compare .score { margin: 0 auto; align-self: center; text-align: center; }
#compare .score .label { text-align: center; }
#compare .score .value { font-size: 28px; font-weight: 600; line-height: 1.2; }
#compare .score .short { font-size: 14px; font-weight: normal; }
#compare .score .s0 { color: #6aa0d8; }
#compare .score .s1 { color: #e0685f; }
#compare .lead { font-weight: 600; }
#compare .bar { display: flex; height: 18px; border-radius: 3px; overflow: hidden; }
#compare .stats .bar { grid-column: 2 / 4; }
#compare .bar span { box-sizing: border-box; padding: 0 6px; overflow: hidden; font-size: 12px; line-height: 18px; color: #111; }
#compare .bar .s0 { background: #6aa0d8; }
#compare .bar .s1 { background: #e0685f; text-align: right; }
#compare .days .win { display: flex; align-items: center; }
#compare .days .win.s0 { justify-content: flex-end; }
#compare .days img { height: 18px; }
#compare .score img { height: 24px; vertical-align: middle; margin: 0 8px; }
</style></head>
<body>
<header>
  <label><span data-i18n="header.week"></span> <select id="week"></select></label>
  <label><input type="checkbox" id="mine"> <span id="mineText"></span></label>
  <span id="legend"></span>
  <span id="info"></span>
  <select id="lang"></select>
</header>
<div id="compare" hidden></div>
<div id="message" hidden></div>
<table id="table" hidden><thead></thead><tbody></tbody></table>
<script src="i18n.js"></script>
<script>
const DAYS = ["mon", "tue", "wed", "thu", "fri", "sat"];
const WIN_POINTS = { mon: 1, tue: 2, wed: 2, thu: 2, fri: 2, sat: 4 };   // what winning a day gives
const WIN_SCORE = 7;   // the points that win the duel (of the 13 there are)
// dicts: the loaded language files by code; empty: the "no rankings yet" message is showing
const state = { data: null, sortKey: "total", ascending: false, lang: "en", dicts: {}, empty: false };

const el = (id) => document.getElementById(id);
const t = (key, vars) => translate(state.dicts, state.lang, key, vars);
const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, "'");
const rankNumber = (rank) => (rank ? Number(rank.slice(1)) : null);   // "R4" -> 4: R5 is the highest
const get = (player, key) =>
  key === "alliance_rank" ? rankNumber(player.alliance_rank) : DAYS.includes(key) ? player.points[key] : player[key];

function showMessage(text) {
  el("message").textContent = text;
  el("message").hidden = !text;
  el("table").hidden = !!text;
}

function visiblePlayers() {
  const data = state.data;
  let players = data.players;
  if (el("mine").checked) players = players.filter((p) => p.alliance === data.my_alliance && p.tag === data.my_tag);
  const key = state.sortKey, sign = state.ascending ? 1 : -1;
  return players.slice().sort((a, b) => {
    const x = get(a, key), y = get(b, key);
    if (x === y) return 0;
    if (x === null || x === undefined) return 1;   // a missing value always goes last
    if (y === null || y === undefined) return -1;
    return typeof x === "string" ? sign * x.localeCompare(y, state.lang) : sign * (x - y);
  });
}

// heat 0 = red, 0.5 = amber, 1 = green (see aggregate.py): the hue runs red 0 -> amber 45 -> green 130
const tint = (heat) => "hsl(" + Math.round(heat < 0.5 ? 90 * heat : 45 + 170 * (heat - 0.5)) + ", 32%, 25%)";

function cell(row, text, className, value, key, player) {
  const td = document.createElement("td");
  td.className = className;
  td.textContent = text;
  if (value !== null && value !== undefined) td.dataset.value = value;
  if (player && player.heat[key] !== null && player.heat[key] !== undefined) {
    td.style.background = tint(player.heat[key]);
    const phase = player.phase[key], phases = state.data.phases;
    td.title = phase ? t("cell.phase", { phase, total: phases.length, points: fmt(phases[phase - 1]) }) : t("cell.below");
    if (player.filled.includes(key)) {
      td.classList.add("filled");
      td.title = t("cell.filled");
    }
  }
  row.appendChild(td);
  return td;
}

// red below the first phase of the colour scale, green from its last, amber in between (phases 5 and 9 today)
function statusIcon(phase) {
  const scale = state.data.scale;
  const color = phase >= scale[scale.length - 1].phase ? "green" : phase < scale[0].phase ? "red" : "amber";
  const img = document.createElement("img");
  img.className = "status";
  img.src = "assets/" + color + ".png";   // relative: also works under /<repo>/ on GitHub Pages
  img.alt = "";
  return img;
}

const sum = (values) => values.reduce((a, b) => a + b, 0);
function median(values) {
  const sorted = values.slice().sort((a, b) => a - b), middle = sorted.length >> 1;
  return sorted.length % 2 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2;
}

function winIcon() {
  const img = document.createElement("img");
  img.src = "assets/win.png";   // relative: also works under /<repo>/ on GitHub Pages
  img.alt = "";
  return img;
}

// The bar that splits 100 % between two values (the share of each, rounded so that the two make 100); none without points.
function shareBar(values) {
  const both = values[0] + values[1];
  if (!both) return null;
  const first = Math.round((100 * values[0]) / both), shares = [first, 100 - first];
  const bar = document.createElement("div");
  bar.className = "bar";
  values.forEach((_, index) => {
    const part = document.createElement("span");
    part.className = "s" + index;
    part.style.width = shares[index] + "%";
    part.textContent = shares[index] + "%";
    bar.appendChild(part);
  });
  return bar;
}

// The two alliances side by side, the own one first (blue, the other red). Left: their points of the week so far
// with the share of the two, and what a member has on average and in the middle. Right: the same share bar for every
// day, the winner of a finished day marked. Every player of the table counts, the "my alliance" filter does not.
function renderCompare() {
  const box = el("compare"), data = state.data;
  const groups = new Map();
  for (const player of data.players) {
    if (!player.alliance) continue;
    const key = [player.alliance, player.tag].join("|");
    if (!groups.has(key)) groups.set(key, { alliance: player.alliance, tag: player.tag, players: [], mine: player.alliance === data.my_alliance && player.tag === data.my_tag });
    groups.get(key).players.push(player);
  }
  const sides = [...groups.values()]
    .map((group) => {
      const totals = group.players.map((player) => player.total);
      // the other alliance's members that are not in any list have 0 points: the count the week file knows of them
      const unseen = !group.mine && data.my_alliance ? Math.max(0, (data.opponent_members || 0) - totals.length) : 0;
      totals.push(...Array(unseen).fill(0));
      return { ...group, members: totals.length, total: sum(totals), average: Math.round(sum(totals) / totals.length), median: Math.round(median(totals)) };
    })
    .sort((a, b) => b.mine - a.mine || b.total - a.total)
    .slice(0, 2);
  box.replaceChildren();
  box.hidden = sides.length < 2;
  if (box.hidden) return;
  const add = (parent, text, className) => {
    const div = document.createElement("div");
    div.className = className || "";
    div.textContent = text;
    parent.appendChild(div);
    return div;
  };
  const stats = add(box, "", "stats");
  add(stats, "", "label");
  sides.forEach((side, index) => {
    const head = add(stats, (side.tag ? "[" + side.tag + "] " : "") + side.alliance, "head s" + index);
    const members = document.createElement("small");
    members.textContent = t("compare.members", { n: side.members });
    head.appendChild(members);
  });
  const bar = shareBar(sides.map((side) => side.total));
  if (bar) stats.appendChild(bar);
  const rows = [["total", t("compare.total")], ["average", t("compare.average")], ["median", t("compare.median")]];
  for (const [key, label] of rows) {
    add(stats, label, "label");
    sides.forEach((side, index) => {
      const lead = side[key] > sides[1 - index][key];   // the higher one is bold
      add(stats, fmt(side[key]), lead ? "lead" : "");
    });
  }
  const score = add(box, "", "score");   // between the two halves, filled in once the days are counted
  const days = add(box, "", "days");
  const won = [0, 0];   // the points of the days each side won
  for (const day of DAYS) {   // every weekday has its row; a day without data yet has no bar
    const points = data.days.includes(day) ? sides.map((side) => sum(side.players.map((player) => player.points[day] || 0))) : [0, 0];
    const dayBar = shareBar(points);
    if (dayBar) dayBar.title = t("compare.versus", { a: fmt(points[0]), b: fmt(points[1]) });
    add(days, t("weekday." + day), "label");
    const winner = dayBar && data.final[day] && points[0] !== points[1] ? (points[0] > points[1] ? 0 : 1) : -1;   // only a finished day has one
    if (winner >= 0) won[winner] += WIN_POINTS[day];
    sides.forEach((_, index) => {
      const cell = add(days, "", "win s" + index);
      if (index === winner) {
        cell.appendChild(winIcon());
      }
      if (index === 0) days.appendChild(dayBar || document.createElement("div"));
    });
  }
  score.title = t("compare.score_title", { first: WIN_POINTS.mon, last: WIN_POINTS.sat, other: WIN_POINTS.tue });
  add(score, t("compare.score"), "label");
  const value = add(score, "", "value");
  const part = (text, className) => { add(value, text, className).style.display = "inline"; };
  const duelWon = won.findIndex((points) => points >= WIN_SCORE);   // the duel is decided: its winner gets the icon
  if (duelWon === 0) value.appendChild(winIcon());
  part(sides[0].tag || sides[0].alliance, "short s0");
  part(" " + won[0], "s0");
  value.append(" : ");
  part(won[1] + " ", "s1");
  part(sides[1].tag || sides[1].alliance, "short s1");
  if (duelWon === 1) value.appendChild(winIcon());
}

function legend() {
  const box = el("legend");
  box.replaceChildren();
  for (const step of state.data.scale) {
    const item = document.createElement("span");
    item.style.background = tint(step.color === "red" ? 0 : step.color === "amber" ? 0.5 : 1);
    item.textContent = t("legend.step", { color: t("color." + step.color), phase: step.phase, points: fmt(step.points) });
    box.appendChild(item);
  }
}

function head(columns) {
  const tr = document.createElement("tr");
  for (const column of columns) {
    const th = document.createElement("th");
    th.className = column.text || column.left ? "text" : "";
    if (column.title) th.title = column.title;
    if (state.sortKey === column.key) th.className += " sorted" + (state.ascending ? " asc" : "");
    if (column.live) th.className += " live";
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = column.label;
    th.appendChild(label);
    if (column.sub) {
      const small = document.createElement("small");
      small.textContent = column.sub;
      th.appendChild(small);
    }
    th.onclick = () => {
      state.ascending = state.sortKey === column.key ? !state.ascending : !!column.text;
      state.sortKey = column.key;
      render();
    };
    tr.appendChild(th);
  }
  return tr;
}

function render() {
  const data = state.data;
  if (!data) return;
  const columns = [{ key: "rank", label: "#" }, { key: "name", label: t("col.player"), text: true },
    { key: "alliance_rank", label: t("col.rank"), left: true, title: t("col.rank_title") },
    { key: "alliance", label: t("col.alliance"), text: true }];
  for (const day of data.days) {
    columns.push({
      key: day, label: t("weekday." + day), live: !data.final[day],
      sub: shortDate(data.dates[day]) + (data.final[day] ? "" : " " + t("day.preliminary")),
      title: [t("day.scanned", { time: moment(data.captured_at[day]) }), data.final[day] ? "" : t("day.preliminary_title")]
        .filter(Boolean).join("\n"),
    });
  }
  columns.push({ key: "total", label: t("col.total") }, { key: "average", label: t("col.average") }, { key: "median", label: t("col.median") });
  const thead = document.querySelector("#table thead");
  thead.replaceChildren(head(columns.map((c) => (c.key === "rank" ? { ...c, key: "total" } : c))));
  const players = visiblePlayers();
  const tbody = document.querySelector("#table tbody");
  tbody.replaceChildren();
  players.forEach((player, index) => {
    const tr = document.createElement("tr");
    const mine = player.alliance === data.my_alliance && player.tag === data.my_tag;
    if (mine) tr.className = "mine";
    cell(tr, index + 1, "rank");
    cell(tr, player.name, "text name");
    cell(tr, player.alliance_rank, "arank");
    const alliance = cell(tr, player.alliance, "text");
    if (player.tag) {
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = "[" + player.tag + "] ";
      alliance.prepend(tag);
    }
    for (const day of data.days) {
      const value = player.points[day];
      const td = cell(tr, value === null ? "-" : fmt(value), "num" + (value === null ? " none" : ""), value, day, player);
      if (mine && value !== null) td.prepend(statusIcon(player.phase[day]));
    }
    cell(tr, fmt(player.total), "num total", player.total);
    cell(tr, fmt(player.average), "num", player.average, "average", player);
    cell(tr, fmt(player.median), "num", player.median, "median", player);
    tbody.appendChild(tr);
  });
  const live = data.days.filter((d) => !data.final[d]).map((d) => t("weekday." + d));
  const info = [t("info.players", { n: players.length })];
  if (live.length) info.push(t("info.preliminary", { days: live.join(", ") }));
  const latest = Object.values(data.captured_at).sort().pop();   // ISO times in UTC sort as text
  if (latest) info.push(t("info.scanned", { time: moment(latest) }));
  const zeroMembers = players.filter((player) => player.filled.length).length;   // the ones with an italic cell
  if (zeroMembers) info.push(t("info.zero_members", { n: zeroMembers }));
  el("info").textContent = info.join(" | ");
  legend();
  renderCompare();
  showMessage(players.length ? "" : t("msg.nobody"));
}

async function load(week) {
  const response = await fetch("api/week/" + week + ".json");   // relative: also works under /<repo>/ on GitHub Pages
  state.data = await response.json();
  applyTexts();
  render();
}

// the date without its year, in the order of the language (16.11. or 11/16)
const shortDate = (iso) => new Date(iso + "T12:00:00").toLocaleDateString(state.lang, { day: "numeric", month: "numeric" });

// a UTC timestamp as the viewer's local date and time, in the order of the language (17.11., 19:04)
const moment = (iso) => new Date(iso).toLocaleString(state.lang, { day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" });

// the texts that render() does not rebuild: the labels of the page, its title, the language selector
function applyTexts() {
  document.documentElement.lang = state.lang;
  document.title = t("page.title");
  document.querySelectorAll("[data-i18n]").forEach((node) => { node.textContent = t(node.dataset.i18n); });
  const data = state.data;
  el("mineText").textContent = data && data.my_alliance ? t("header.mine_named", { name: data.my_alliance }) : t("header.mine");
  el("lang").title = t("header.language");
  el("lang").value = state.lang;
  if (state.empty) showMessage(t("msg.none"));
}

// Changes the language: loads its file (one that cannot be loaded leaves the language in use) and redraws.
async function setLanguage(lang) {
  if (!state.dicts[lang]) {
    try {
      state.dicts[lang] = await (await fetch("i18n/" + lang + ".json")).json();
    } catch (error) {
      return;
    }
  }
  state.lang = lang;
  applyTexts();
  render();
}

// The header wraps onto more lines when its texts are long (info line, language), so the column heads stick below
// its real height: a fixed offset would leave the top of the heads hidden behind it.
function trackHeaderHeight() {
  const header = document.querySelector("header");
  const set = () => document.documentElement.style.setProperty("--header-height", header.offsetHeight + "px");
  new ResizeObserver(set).observe(header);
  set();
}

async function start() {
  trackHeaderHeight();
  state.dicts.en = await (await fetch("i18n/en.json")).json();   // English first: the others fall back to it
  const lang = el("lang");
  for (const [code, name] of LANGUAGES) lang.add(new Option(name, code));
  lang.onchange = () => { localStorage.setItem("adr_lang", lang.value); setLanguage(lang.value); };
  await setLanguage(pickLanguage(localStorage.getItem("adr_lang"), navigator.languages || [navigator.language]));
  const weeks = await (await fetch("api/weeks.json")).json();
  if (!weeks.length) {
    state.empty = true;
    applyTexts();
    return;
  }
  const select = el("week");
  for (const week of weeks) select.add(new Option(week, week));
  el("mine").checked = localStorage.getItem("adr_mine") === "1";
  select.onchange = () => load(select.value);
  el("mine").onchange = () => { localStorage.setItem("adr_mine", el("mine").checked ? "1" : "0"); render(); };
  await load(weeks[0]);
}

start();
</script>
</body></html>
