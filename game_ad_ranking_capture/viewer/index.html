<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Alliance Duel rankings</title>
<style>
body { font: 14px/1.4 system-ui, sans-serif; margin: 0; background: #1b1d22; color: #e6e6e6; }
header { position: sticky; top: 0; z-index: 2; background: #23262d; padding: 10px 14px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid #000; }
select { background: #14161a; color: inherit; border: 1px solid #444; border-radius: 4px; padding: 5px 8px; font: inherit; }
label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
#info { margin-left: auto; color: #9aa; }
#message { padding: 24px 14px; color: #c9a227; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 5px 10px; border-bottom: 1px solid #2c2f37; white-space: nowrap; }
th { position: sticky; top: 49px; background: #23262d; text-align: right; cursor: pointer; user-select: none; z-index: 1; }
th.text, td.text { text-align: left; }
td.num { text-align: right; }
th small { display: block; font-weight: normal; color: #8a93a0; }
th.live small { color: #d9a441; }
th.sorted .label::after { content: " \25BC"; font-size: 10px; }   /* on the label, so it stays on the first line */
th.sorted.asc .label::after { content: " \25B2"; }
td.none { color: #555; }
td.rank { color: #8a93a0; text-align: right; }
td.total { font-weight: 600; }
tr:hover td { background: #262a32; }
tr.mine td.name { color: #6cc070; }
.tag { color: #8a93a0; }
#legend { display: flex; gap: 12px; align-items: center; color: #9aa; font-size: 12px; }
#legend span { padding: 1px 8px; border-radius: 3px; color: #e6e6e6; }
</style></head>
<body>
<header>
  <label>Week <select id="week"></select></label>
  <label><input type="checkbox" id="mine"> <span id="mineText">My alliance</span></label>
  <span id="legend"></span>
  <span id="info"></span>
</header>
<div id="message" hidden></div>
<table id="table" hidden><thead></thead><tbody></tbody></table>
<script>
const DAY_NAMES = { mon: "Mon", tue: "Tue", wed: "Wed", thu: "Thu", fri: "Fri", sat: "Sat" };
const state = { data: null, sortKey: "total", ascending: false };

const el = (id) => document.getElementById(id);
const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, "'");
const get = (player, key) => (DAY_NAMES[key] ? player.points[key] : player[key]);

function showMessage(text) {
  el("message").textContent = text;
  el("message").hidden = !text;
  el("table").hidden = !!text;
}

function visiblePlayers() {
  const data = state.data;
  let players = data.players;
  if (el("mine").checked) players = players.filter((p) => p.alliance === data.my_alliance && p.tag === data.my_tag);
  const key = state.sortKey, sign = state.ascending ? 1 : -1;
  return players.slice().sort((a, b) => {
    const x = get(a, key), y = get(b, key);
    if (x === y) return 0;
    if (x === null || x === undefined) return 1;   // a missing value always goes last
    if (y === null || y === undefined) return -1;
    return typeof x === "string" ? sign * x.localeCompare(y) : sign * (x - y);
  });
}

// heat 0 = red, 0.5 = amber, 1 = green (see aggregate.py): the hue runs red 0 -> amber 45 -> green 130
const tint = (heat) => "hsl(" + Math.round(heat < 0.5 ? 90 * heat : 45 + 170 * (heat - 0.5)) + ", 32%, 25%)";

function cell(row, text, className, value, key, player) {
  const td = document.createElement("td");
  td.className = className;
  td.textContent = text;
  if (value !== null && value !== undefined) td.dataset.value = value;
  if (player && player.heat[key] !== null && player.heat[key] !== undefined) {
    td.style.background = tint(player.heat[key]);
    const phase = player.phase[key], phases = state.data.phases;
    td.title = phase ? "Phase " + phase + " of " + phases.length + " (from " + fmt(phases[phase - 1]) + ")" : "Below phase 1";
  }
  row.appendChild(td);
  return td;
}

function legend() {
  const box = el("legend");
  box.replaceChildren();
  for (const step of state.data.scale) {
    const item = document.createElement("span");
    item.style.background = tint(step.color === "red" ? 0 : step.color === "amber" ? 0.5 : 1);
    item.textContent = step.color + " ~ phase " + step.phase + " (" + fmt(step.points) + ")";
    box.appendChild(item);
  }
}

function head(columns) {
  const tr = document.createElement("tr");
  for (const column of columns) {
    const th = document.createElement("th");
    th.className = column.text ? "text" : "";
    if (state.sortKey === column.key) th.className += " sorted" + (state.ascending ? " asc" : "");
    if (column.live) th.className += " live";
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = column.label;
    th.appendChild(label);
    if (column.sub) {
      const small = document.createElement("small");
      small.textContent = column.sub;
      th.appendChild(small);
    }
    th.onclick = () => {
      state.ascending = state.sortKey === column.key ? !state.ascending : !!column.text;
      state.sortKey = column.key;
      render();
    };
    tr.appendChild(th);
  }
  return tr;
}

function render() {
  const data = state.data;
  if (!data) return;
  const columns = [{ key: "rank", label: "#" }, { key: "name", label: "Player", text: true }, { key: "alliance", label: "Alliance", text: true }];
  for (const day of data.days) {
    columns.push({ key: day, label: DAY_NAMES[day], sub: data.dates[day].slice(5) + (data.final[day] ? "" : " prelim."), live: !data.final[day] });
  }
  columns.push({ key: "total", label: "Total" }, { key: "average", label: "Average" }, { key: "median", label: "Median" });
  const thead = document.querySelector("#table thead");
  thead.replaceChildren(head(columns.map((c) => (c.key === "rank" ? { ...c, key: "total" } : c))));
  const players = visiblePlayers();
  const tbody = document.querySelector("#table tbody");
  tbody.replaceChildren();
  players.forEach((player, index) => {
    const tr = document.createElement("tr");
    if (player.alliance === data.my_alliance && player.tag === data.my_tag) tr.className = "mine";
    cell(tr, index + 1, "rank");
    cell(tr, player.name, "text name");
    const alliance = cell(tr, player.alliance, "text");
    if (player.tag) {
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = "[" + player.tag + "] ";
      alliance.prepend(tag);
    }
    for (const day of data.days) {
      const value = player.points[day];
      cell(tr, value === null ? "-" : fmt(value), "num" + (value === null ? " none" : ""), value, day, player);
    }
    cell(tr, fmt(player.total), "num total", player.total);
    cell(tr, fmt(player.average), "num", player.average, "average", player);
    cell(tr, fmt(player.median), "num", player.median, "median", player);
    tbody.appendChild(tr);
  });
  const live = data.days.filter((d) => !data.final[d]).map((d) => DAY_NAMES[d]);
  el("info").textContent = players.length + " players" + (live.length ? " | preliminary: " + live.join(", ") : "");
  legend();
  showMessage(players.length ? "" : "Nobody to show.");
}

async function load(week) {
  const response = await fetch("/api/week/" + week);
  state.data = await response.json();
  el("mineText").textContent = state.data.my_alliance ? "My alliance (" + state.data.my_alliance + ")" : "My alliance";
  render();
}

async function start() {
  const weeks = await (await fetch("/api/weeks")).json();
  if (!weeks.length) {
    showMessage("No rankings yet: run a scan from the window first.");
    return;
  }
  const select = el("week");
  for (const week of weeks) select.add(new Option(week, week));
  el("mine").checked = localStorage.getItem("adr_mine") === "1";
  select.onchange = () => load(select.value);
  el("mine").onchange = () => { localStorage.setItem("adr_mine", el("mine").checked ? "1" : "0"); render(); };
  await load(weeks[0]);
}

start();
</script>
</body></html>
