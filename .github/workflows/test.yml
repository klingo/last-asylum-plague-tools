name: Test

# Each tool's own tests (small inline data, no game and no device needed). Windows, like the tools: they use
# Windows-only parts (overlay, hotkeys, tkinter windows) and the Mahjong tests on recorded games skip themselves
# because `recordings/` is git-ignored.
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch: {}

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    pytest:
        runs-on: windows-latest
        strategy:
            fail-fast: false
            matrix:
                tool: [game_asset_extractor, mahjong_minigame_helper]
        defaults:
            run:
                working-directory: ${{ matrix.tool }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.12'
                  cache: pip
                  cache-dependency-path: ${{ matrix.tool }}/requirements.txt

            - name: Install the requirements
              run: python -m pip install -r requirements.txt

            - name: Test
              run: python -m pytest -q
